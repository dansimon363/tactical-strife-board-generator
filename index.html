<!DOCTYPE html>
<html>
<head>
  <title>Tactical Strife Board Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Tactical Strife Board Generator</h1>
  <a href="https://github.com/dansimon363/tactical-strife-board-generator" target="_blank">View on GitHub</a>
  <a href="https://www.thegamecrafter.com/games/tactical-strife" target="_blank">Tactical Strife on The Game Crafter</a>

  <br><br>
  <section id="playerSelection">
    <p>Select 2 to 4 HQs to generate a map for that many players.</p>
    <label><input type="checkbox" id="hqBlue" checked> Blue HQ</label>
    <label><input type="checkbox" id="hqGreen" checked> Green HQ</label>
    <label><input type="checkbox" id="hqOrange" checked> Orange HQ</label>
    <label><input type="checkbox" id="hqPurple" checked> Purple HQ</label>
  </section>

  <button id="generateBtn">Generate Map</button>

  <canvas id="mapCanvas"></canvas>

  <script src="app.js"></script>

</body>
</html>
